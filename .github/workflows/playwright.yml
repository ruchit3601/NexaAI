name: Playwright Tests          # label shown in the GitHub Actions tab
on:
  push:
    branches: [ main, master ]  # run when code is pushed to main or master
  pull_request:
    branches: [ main, master ]  # also run when a PR targets these branches
jobs:
  test:                         # this job is called "test"
    timeout-minutes: 60         # kill the job if it runs over 60 min
    runs-on: ubuntu-latest       # the VM image GitHub spins up to run this
    steps:
    - uses: actions/checkout@v4  # step 1: pull your repo code onto that VM
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*     # step 2: install latest LTS Node
    - name: Install dependencies
      run: npm ci                # step 3: install deps (npm ci = clean, uses package-lock exactly)
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps  # step 4: Playwright needs real browser binaries, not just the npm package
    - name: Run Playwright tests
      run: npx playwright test   # step 5: actually run the test suite
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}    # step 6: even if tests failed, upload the HTML report
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30       # keep the report for 30 days, then auto-delete